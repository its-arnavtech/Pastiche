# Runtime profile for POC 1 (local-max). Unset keys fall back to remixer.config.DEFAULT_PROFILE.
# Override the file with REMIXER_PROFILE, the data dir with REMIXER_DATA_DIR.
name: local-max
mode: stable             # stable (default: the capped preset below) | unleashed (explicit --unleashed only) | safe

# The stable preset (decision 0030): the capped configuration that survived the laptop shutdowns.
# `remixer --unleashed ...` lifts every cap below and prints a warning.
stable:
  cpu_workers: 8             # CPU render lane
  separation_model: htdemucs # light Demucs only (no htdemucs_ft + shifts)
  gpu_batch: 8               # Demucs batch upper bound
  npu_devices: [NPU]         # NPU only, no iGPU
  watchdog: true
  cpu_limit_c: 93.0          # CPU zone median; the sensor tops out at 95.9 C, so 97 never fired
  gpu_limit_c: 94.0
  resume_margin_c: 8.0
  cooldown_c: 82.0

adapters:
  blob_store: fs         # content-addressed files under <data>/blobs
  catalog: sqlite        # <data>/catalog.sqlite
  event_sink: parquet    # <data>/events/<stream>/*.parquet, queried with DuckDB
  vector_index: hnsw     # hnswlib, <data>/vectors
  job_queue: sqlite      # <data>/jobs.sqlite, leases + retries
  compute: local         # CUDA via torch + pynvml, CPU via psutil
  llm: ollama            # phase 4

gpu:
  separation_model: htdemucs
  heavy_model: htdemucs_ft
  heavy_shifts: 2
  fp16: true
  embedding_model: laion/clap-htsat-unfused
  window_s: 5.0

telemetry:
  interval_s: 1.0

llm:
  url: http://127.0.0.1:11434
  model: qwen3:4b        # already pulled on this machine (decision 0028); default llama3.2:3b is not

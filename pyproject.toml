[project]
name = "remixer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
analytics = [
    "duckdb>=1.0",
    "numpy>=1.26",
    "pyarrow>=15",
]
web-test = [
    "playwright>=1.45",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.13",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "scale: multi-million-event benchmark (opt in with -m scale)",
    "web: headless browser tests (need the web-test extra and `playwright install chromium`)",
]
addopts = "-m 'not scale'"

[project]
name = "remixer"
version = "0.1.0"
description = "StemDNA POC 1: local, hardware-maxing stem separation, analysis and remix pipeline"
authors = [
    { name = "its-arnavtech", email = "arnavk174@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "demucs>=4.1.0",
    "duckdb>=2.0.0",
    "hnswlib>=0.8.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "nvidia-ml-py>=13.615.71",
    "openvino>=2026.4.1",
    "pedalboard>=0.9.26",
    "psutil>=7.2.2",
    "pyarrow>=26.0.0",
    "pyloudnorm>=0.2.0",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
    "torch==2.14.1",
    "transformers>=5.21.0",
]

[project.scripts]
remixer = "remixer.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gpu: needs a CUDA GPU",
    "slow: long-running",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]
